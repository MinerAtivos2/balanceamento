<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradingView — Monitor de Ações</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        h1 { color: #00d4aa; margin-bottom: 15px; font-size: 1.6rem; }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .controls button {
            padding: 8px 16px;
            border: 1px solid #00d4aa;
            background: transparent;
            color: #00d4aa;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s;
        }
        .controls button:hover, .controls button.active {
            background: #00d4aa;
            color: #0f0c29;
        }
        .controls select, .controls input {
            padding: 8px 12px;
            border: 1px solid #00d4aa;
            background: rgba(255,255,255,0.08);
            color: #fff;
            border-radius: 6px;
            font-size: 0.9rem;
        }
        .controls input { width: 220px; }
        .controls select { width: 180px; }
        #tv_chart_container {
            width: 100%;
            max-width: 1400px;
            height: 650px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            background: #131722;
        }
        .footer {
            margin-top: 15px;
            color: rgba(255,255,255,0.4);
            font-size: 0.75rem;
        }
        .footer a { color: #00d4aa; text-decoration: none; }
    </style>
</head>
<body>

    <h1>📊 Monitor de Ações — TradingView</h1>

    <!-- Controles -->
    <div class="controls">
        <input type="text" id="symbolInput" placeholder="Ex: BMFBOVESPA:PETR4" value="BMFBOVESPA:PETR4">
        
        <select id="presetSelect" onchange="loadPreset()">
            <option value="">⭐ Ações Rápidas</option>
            <option value="BMFBOVESPA:PETR4">Petrobras PN</option>
            <option value="BMFBOVESPA:VALE3">Vale ON</option>
            <option value="BMFBOVESPA:ITUB4">Itaú PN</option>
            <option value="BMFBOVESPA:BBAS3">Banco do Brasil</option>
            <option value="BMFBOVESPA:BBDC4">Bradesco PN</option>
            <option value="BMFBOVESPA:BRSR6">Banrisul PN</option>
            <option value="BMFBOVESPA:WEGE3">WEG ON</option>
            <option value="NASDAQ:AAPL">Apple</option>
            <option value="NASDAQ:MSFT">Microsoft</option>
            <option value="NASDAQ:NVDA">NVIDIA</option>
            <option value="BINANCE:BTCUSDT">Bitcoin</option>
        </select>

        <button onclick="changeSymbol()">🔍 Carregar</button>
        <button onclick="setInterval_('1')">1m</button>
        <button onclick="setInterval_('5')">5m</button>
        <button onclick="setInterval_('15')">15m</button>
        <button onclick="setInterval_('60')">1h</button>
        <button onclick="setInterval_('D')" class="active" id="btnD">Diário</button>
        <button onclick="setInterval_('W')">Semanal</button>
        <button onclick="setInterval_('M')">Mensal</button>
    </div>

    <!-- Gráfico -->
    <div id="tv_chart_container"></div>

    <div class="footer">
        Dados fornecidos por <a href="https://www.tradingview.com/" target="_blank">TradingView</a>
    </div>

    <!-- Charting Library CDN -->
    <script src="https://charting-library.tradingview-widget.com/charting_library/charting_library.standalone.js"></script>

    <script>
        // ============================================
        // CONFIGURAÇÃO — ALTERE AQUI
        // ============================================
        const CONFIG = {
            symbol: 'BMFBOVESPA:PETR4',
            interval: 'D',
            theme: 'dark',
            locale: 'br',
            timezone: 'America/Sao_Paulo',
            style: 1,
        };

        let tvWidget = null;

        // ============================================
        // INICIALIZAÇÃO DO WIDGET
        // ============================================
        function initWidget(symbol, interval) {
            if (tvWidget) {
                try { tvWidget.remove(); } catch(e) {}
            }

            tvWidget = new TradingView.widget({
                symbol: symbol || CONFIG.symbol,
                interval: interval || CONFIG.interval,
                theme: CONFIG.theme,
                style: CONFIG.style,
                locale: CONFIG.locale,
                timezone: CONFIG.timezone,
                container: 'tv_chart_container',
                library_path: 'https://charting-library.tradingview-widget.com/charting_library/',
                fullscreen: false,
                autosize: true,

                enabled_features: [
                    'study_templates',
                    'use_localstorage_for_settings',
                    'save_chart_properties_to_local_storage',
                    'header_compare',
                    'header_symbol_search',
                    'header_chart_type',
                    'header_indicators',
                    'header_undo_redo',
                    'header_screenshot',
                    'header_fullscreen_button',
                ],
                disabled_features: ['popup_hints'],

                overrides: {
                    'mainSeriesProperties.candleStyle.upColor': '#00d4aa',
                    'mainSeriesProperties.candleStyle.downColor': '#ff4757',
                    'mainSeriesProperties.candleStyle.borderUpColor': '#00d4aa',
                    'mainSeriesProperties.candleStyle.borderDownColor': '#ff4757',
                    'mainSeriesProperties.candleStyle.wickUpColor': '#00d4aa',
                    'mainSeriesProperties.candleStyle.wickDownColor': '#ff4757',
                    'paneProperties.background': '#131722',
                    'paneProperties.backgroundType': 'solid',
                },
            });

            tvWidget.onChartReady(function() {
                const chart = tvWidget.activeChart();
                chart.createStudy('Moving Average', false, false, { length: 20 });
                chart.createStudy('Moving Average', false, false, { length: 50 });
                chart.createStudy('Volume', true, false);
                console.log('✅ Gráfico pronto:', symbol || CONFIG.symbol);
            });
        }

        // ============================================
        // CONTROLES
        // ============================================
        function changeSymbol() {
            const input = document.getElementById('symbolInput').value.trim().toUpperCase();
            if (input) {
                CONFIG.symbol = input;
                initWidget(input, CONFIG.interval);
            }
        }

        function loadPreset() {
            const sel = document.getElementById('presetSelect').value;
            if (sel) {
                document.getElementById('symbolInput').value = sel;
                CONFIG.symbol = sel;
                initWidget(sel, CONFIG.interval);
            }
        }

        function setInterval_(newInterval) {
            CONFIG.interval = newInterval;
            initWidget(CONFIG.symbol, newInterval);
            document.querySelectorAll('.controls button').forEach(b => b.classList.remove('active'));
            if (event && event.target) event.target.classList.add('active');
        }

        document.getElementById('symbolInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') changeSymbol();
        });

        // ============================================
        // INICIAR
        // ============================================
        initWidget();
    </script>

</body>
</html>
