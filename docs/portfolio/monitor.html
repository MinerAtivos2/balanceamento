<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor de Ações — TradingView</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        h1 { color: #00d4aa; margin-bottom: 15px; font-size: 1.5rem; }

        .controls {
            display: flex; gap: 10px; margin-bottom: 15px;
            flex-wrap: wrap; justify-content: center;
        }
        .controls select, .controls button {
            padding: 8px 14px;
            border: 1px solid #00d4aa;
            background: rgba(255,255,255,0.08);
            color: #00d4aa;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s;
        }
        .controls button:hover, .controls button.active {
            background: #00d4aa; color: #0f0c29;
        }

        .chart-wrapper {
            width: 100%;
            max-width: 1400px;
            height: 660px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            background: #131722;
        }

        .footer {
            margin-top: 12px;
            color: rgba(255,255,255,0.3);
            font-size: 0.75rem;
        }
        .footer a { color: #00d4aa; text-decoration: none; }
    </style>
</head>
<body>

    <h1>📊 Monitor de Ações — TradingView</h1>

    <!-- Seletor de ação -->
    <div class="controls">
        <select id="stockSelect">
            <optgroup label="🇧🇷 Brasil (B3)">
                <option value="BMFBOVESPA:PETR4" selected>Petrobras PN (PETR4)</option>
                <option value="BMFBOVESPA:VALE3">Vale ON (VALE3)</option>
                <option value="BMFBOVESPA:ITUB4">Itaú PN (ITUB4)</option>
                <option value="BMFBOVESPA:BBAS3">Banco do Brasil (BBAS3)</option>
                <option value="BMFBOVESPA:BBDC4">Bradesco PN (BBDC4)</option>
                <option value="BMFBOVESPA:BRSR6">Banrisul PN (BRSR6)</option>
                <option value="BMFBOVESPA:WEGE3">WEG ON (WEGE3)</option>
                <option value="BMFBOVESPA:MGLU3">Magazine Luiza (MGLU3)</option>
                <option value="BMFBOVESPA:ABEV3">Ambev (ABEV3)</option>
            </optgroup>
            <optgroup label="🇺🇸 EUA">
                <option value="NASDAQ:AAPL">Apple (AAPL)</option>
                <option value="NASDAQ:MSFT">Microsoft (MSFT)</option>
                <option value="NASDAQ:NVDA">NVIDIA (NVDA)</option>
                <option value="NASDAQ:GOOGL">Google (GOOGL)</option>
                <option value="NASDAQ:AMZN">Amazon (AMZN)</option>
                <option value="NASDAQ:META">Meta (META)</option>
                <option value="NASDAQ:TSLA">Tesla (TSLA)</option>
            </optgroup>
            <optgroup label="🪙 Cripto">
                <option value="BINANCE:BTCUSDT">Bitcoin (BTC)</option>
                <option value="BINANCE:ETHUSDT">Ethereum (ETH)</option>
                <option value="BINANCE:SOLUSDT">Solana (SOL)</option>
            </optgroup>
            <optgroup label="📊 Índices">
                <option value="BMFBOVESPA:IBOV">Ibovespa</option>
                <option value="SP:SPX">S&P 500</option>
                <option value="NASDAQ:NDX">Nasdaq 100</option>
            </optgroup>
        </select>

        <button onclick="loadChart()">🔍 Carregar</button>
        <button onclick="loadChart('1')" >1m</button>
        <button onclick="loadChart('5')" >5m</button>
        <button onclick="loadChart('15')">15m</button>
        <button onclick="loadChart('60')">1h</button>
        <button onclick="loadChart('D')"  class="active" id="btnD">Diário</button>
        <button onclick="loadChart('W')" >Semanal</button>
        <button onclick="loadChart('M')" >Mensal</button>
    </div>

    <!-- Container do gráfico -->
    <div class="chart-wrapper" id="chartWrapper"></div>

    <div class="footer">
        Dados fornecidos por <a href="https://www.tradingview.com/" target="_blank">TradingView</a>
    </div>

    <script>
        // ============================================
        // CONFIGURAÇÃO
        // ============================================
        let currentInterval = 'D';

        function loadChart(interval) {
            if (interval) currentInterval = interval;

            const symbol = document.getElementById('stockSelect').value;
            const wrapper = document.getElementById('chartWrapper');

            // Limpa o container
            wrapper.innerHTML = '';

            // Cria o container do widget
            const container = document.createElement('div');
            container.className = 'tradingview-widget-container';
            container.style.height = '100%';
            container.style.width = '100%';

            const widgetDiv = document.createElement('div');
            widgetDiv.className = 'tradingview-widget-container__widget';
            widgetDiv.style.height = 'calc(100% - 32px)';
            widgetDiv.style.width = '100%';
            container.appendChild(widgetDiv);

            // Copyright (obrigatório pelo TradingView)
            const copyright = document.createElement('div');
            copyright.className = 'tradingview-widget-copyright';
            copyright.innerHTML = '<a href="https://www.tradingview.com/" rel="noopener nofollow" // Script do widget
            const script = document.createElement('script');
            script.type = 'text/javascript';
            script.src = 'https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js';
            script.async = true;
            script.innerHTML = JSON.stringify({
                "symbol": symbol,
                "interval": currentInterval,
                "timezone": "America/Sao_Paulo",
                "theme": "dark",
                "style": "1",
                "locale": "br",
                "allow_symbol_change": true,
                "calendar": false,
                "hide_side_toolbar": false,
                "hide_top_toolbar": false,
                "hide_legend": false,
                "hide_volume": false,
                "save_image": true,
                "backgroundColor": "#131722",
                "gridColor": "rgba(255, 255, 255, 0.06)",
                "withdateranges": true,
                "details": true,
                "hotlist": true,
                "studies": [
                    "MASimple@tv-basicstudies",
                    "RSI@tv-basicstudies",
                    "MACD@tv-basicstudies"
                ],
                "support_host": "https://www.tradingview.com",
                "autosize": true
            });

            container.appendChild(script);
            wrapper.appendChild(container);

            // Atualizar botão ativo (intervalos)
            document.querySelectorAll('.controls button').forEach(b => b.classList.remove('active'));
            if (event && event.target && event.target.tagName === 'BUTTON') {
                event.target.classList.add('active');
            }
        }

        // ============================================
        // Recarregar ao trocar ação no select
        // ============================================
        document.getElementById('stockSelect').addEventListener('change', function() {
            loadChart();
        });

        // ============================================
        // INICIAR
        // ============================================
        loadChart();
    </script>

</body>
</html>
