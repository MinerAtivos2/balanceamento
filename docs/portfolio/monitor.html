<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor de Ações — TradingView</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        h1 { color: #00d4aa; margin-bottom: 15px; font-size: 1.5rem; }
        .controls {
            display: flex; gap: 10px; margin-bottom: 15px;
            flex-wrap: wrap; justify-content: center;
        }
        .controls select, .controls button {
            padding: 8px 14px;
            border: 1px solid #00d4aa;
            background: rgba(255,255,255,0.08);
            color: #00d4aa;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s;
        }
        .controls button:hover, .controls button.active {
            background: #00d4aa; color: #0f0c29;
        }
        #tv_chart_container {
            width: 100%;
            max-width: 1400px;
            height: 650px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            background: #131722;
        }
        .footer {
            margin-top: 12px; color: rgba(255,255,255,0.3); font-size: 0.75rem;
        }
        .footer a { color: #00d4aa; text-decoration: none; }
    </style>
</head>
<body>

    <h1>📊 Monitor de Ações — TradingView</h1>

    <div class="controls">
        <select id="stockSelect">
            <optgroup label="🇧🇷 Brasil (B3)">
                <option value="BMFBOVESPA:PETR4" selected>Petrobras PN (PETR4)</option>
                <option value="BMFBOVESPA:VALE3">Vale ON (VALE3)</option>
                <option value="BMFBOVESPA:ITUB4">Itaú PN (ITUB4)</option>
                <option value="BMFBOVESPA:BBAS3">Banco do Brasil (BBAS3)</option>
                <option value="BMFBOVESPA:BBDC4">Bradesco PN (BBDC4)</option>
                <option value="BMFBOVESPA:BRSR6">Banrisul PN (BRSR6)</option>
                <option value="BMFBOVESPA:WEGE3">WEG ON (WEGE3)</option>
                <option value="BMFBOVESPA:MGLU3">Magazine Luiza (MGLU3)</option>
                <option value="BMFBOVESPA:ABEV3">Ambev (ABEV3)</option>
            </optgroup>
            <optgroup label="🇺🇸 EUA">
                <option value="NASDAQ:AAPL">Apple (AAPL)</option>
                <option value="NASDAQ:MSFT">Microsoft (MSFT)</option>
                <option value="NASDAQ:NVDA">NVIDIA (NVDA)</option>
                <option value="NASDAQ:GOOGL">Google (GOOGL)</option>
                <option value="NASDAQ:AMZN">Amazon (AMZN)</option>
                <option value="NASDAQ:TSLA">Tesla (TSLA)</option>
            </optgroup>
            <optgroup label="🪙 Cripto">
                <option value="BINANCE:BTCUSDT">Bitcoin (BTC)</option>
                <option value="BINANCE:ETHUSDT">Ethereum (ETH)</option>
                <option value="BINANCE:SOLUSDT">Solana (SOL)</option>
            </optgroup>
        </select>

        <button onclick="loadChart()">🔍 Carregar</button>
        <button onclick="setInt('1')">1m</button>
        <button onclick="setInt('5')">5m</button>
        <button onclick="setInt('15')">15m</button>
        <button onclick="setInt('60')">1h</button>
        <button onclick="setInt('D')" class="active" id="btnD">Diário</button>
        <button onclick="setInt('W')">Semanal</button>
        <button onclick="setInt('M')">Mensal</button>
    </div>

    <!-- Container do gráfico -->
    <div id="tv_chart_container"></div>

    <div class="footer">
        Dados por <a href="https://www.tradingview.com/">

    <!-- ✅ ESTE É O SCRIPT CORRETO: tv.js (público, sem restrição de domínio) -->
    https://s3.tradingview.com/tv.js

    <script type="text/javascript">
        // ============================================
        // CONFIGURAÇÃO
        // ============================================
        var currentSymbol = 'BMFBOVESPA:PETR4';
        var currentInterval = 'D';

        // ============================================
        // CRIAR / RECRIAR O GRÁFICO
        // ============================================
        function loadChart() {
            currentSymbol = document.getElementById('stockSelect').value;

            // Limpa o container antes de recriar
            document.getElementById('tv_chart_container').innerHTML = '';

            new TradingView.widget({
                "container_id": "tv_chart_container",
                "autosize": true,
                "symbol": currentSymbol,
                "interval": currentInterval,
                "timezone": "America/Sao_Paulo",
                "theme": "dark",
                "style": "1",
                "locale": "br",
                "toolbar_bg": "#131722",
                "enable_publishing": false,
                "allow_symbol_change": true,
                "hide_side_toolbar": false,
                "hide_top_toolbar": false,
                "save_image": true,
                "withdateranges": true,
                "details": true,
                "calendar": false,
                "studies": [
                    "MASimple@tv-basicstudies",
                    "RSI@tv-basicstudies",
                    "MACD@tv-basicstudies"
                ],
                "show_popup_button": true,
                "popup_width": "1000",
                "popup_height": "650"
            });
        }

        // ============================================
        // TROCAR INTERVALO
        // ============================================
        function setInt(interval) {
            currentInterval = interval;
            loadChart();

            // Atualizar botão ativo
            document.querySelectorAll('.controls button').forEach(function(b) {
                b.classList.remove('active');
            });
            event.target.classList.add('active');
        }

        // Recarregar ao trocar no dropdown
        document.getElementById('stockSelect').addEventListener('change', function() {
            loadChart();
        });

        // ============================================
        // INICIAR ao carregar a página
        // ============================================
        loadChart();
    </script>

</body>
</html>
